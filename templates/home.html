<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #667085;
            --line: #d0d5dd;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --result-bg: #ecfdf3;
            --error-bg: #fff1f2;
            --error-ink: #be123c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        main {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0;
        }

        .intro {
            margin-bottom: 24px;
        }

        .intro h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.2;
        }

        .intro p {
            margin: 0;
            max-width: 680px;
            color: var(--muted);
            line-height: 1.5;
        }

        .predictor {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 14px 40px rgba(16, 24, 40, 0.08);
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        select,
        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 15px;
            color: var(--ink);
            background: #ffffff;
        }

        select:focus,
        input:focus {
            border-color: var(--accent);
            outline: 3px solid rgba(15, 118, 110, 0.18);
        }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 6px;
        }

        button {
            min-height: 44px;
            border: 0;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: var(--accent);
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .message {
            margin: 0;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 700;
        }

        .result {
            background: var(--result-bg);
            color: var(--accent-dark);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-ink);
        }

        @media (max-width: 700px) {
            main {
                width: min(100% - 24px, 960px);
                padding: 24px 0;
            }

            .intro h1 {
                font-size: 26px;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title">Student Exam Performance Predictor</h1>
            <p>Predict a student's expected math score from academic background, preparation status, reading score, and writing score.</p>
        </section>

        <section class="predictor">
            <form action="{{ url_for('predict_datapoint') }}" method="post">
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option selected disabled value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label for="race_ethnicity">Race or Ethnicity</label>
                    <select id="race_ethnicity" name="race_ethnicity" required>
                        <option selected disabled value="">Select group</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="field">
                    <label for="parental_level_of_education">Parental Level of Education</label>
                    <select id="parental_level_of_education" name="parental_level_of_education" required>
                        <option selected disabled value="">Select education level</option>
                        <option value="associate's degree">Associate's degree</option>
                        <option value="bachelor's degree">Bachelor's degree</option>
                        <option value="high school">High school</option>
                        <option value="master's degree">Master's degree</option>
                        <option value="some college">Some college</option>
                        <option value="some high school">Some high school</option>
                    </select>
                </div>

                <div class="field">
                    <label for="lunch">Lunch Type</label>
                    <select id="lunch" name="lunch" required>
                        <option selected disabled value="">Select lunch type</option>
                        <option value="free/reduced">Free/reduced</option>
                        <option value="standard">Standard</option>
                    </select>
                </div>

                <div class="field">
                    <label for="test_preparation_course">Test Preparation Course</label>
                    <select id="test_preparation_course" name="test_preparation_course" required>
                        <option selected disabled value="">Select course status</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="field">
                    <label for="reading_score">Reading Score</label>
                    <input id="reading_score" type="number" name="reading_score" placeholder="0 to 100" min="0" max="100" required>
                </div>

                <div class="field">
                    <label for="writing_score">Writing Score</label>
                    <input id="writing_score" type="number" name="writing_score" placeholder="0 to 100" min="0" max="100" required>
                </div>

                <div class="actions">
                    <button type="submit">Predict Math Score</button>
                    {% if results is defined %}
                    <p class="message result">Predicted math score: {{ results }}</p>
                    {% endif %}
                    {% if error is defined %}
                    <p class="message error">{{ error }}</p>
                    {% endif %}
                </div>
            </form>
        </section>
    </main>
</body>
</html>
